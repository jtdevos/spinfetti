<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wheel of Fortune</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="app">
    <header>
      <h1>🎡 Spin the Wheel</h1>
    </header>

    <main>
      <section class="wheel-section">
        <div id="wheel-container"></div>
        <button id="spin-btn">SPIN</button>
      </section>

      <section class="panel">
        <h2>Entries</h2>
        <ul id="entry-list"></ul>

        <form id="add-form">
          <input id="add-input" type="text" placeholder="Add an entry…" autocomplete="off" />
          <button type="submit">Add</button>
        </form>

        <details>
          <summary>Bulk edit (one per line)</summary>
          <textarea id="bulk-text" rows="8" placeholder="Paste a list, one entry per line…"></textarea>
          <button id="bulk-apply">Apply</button>
        </details>

        <details>
          <summary>Debug controls</summary>
          <div class="debug-controls">
            <label class="debug-row">
              <span>Camera tilt <output id="out-camera-tilt">6°</output></span>
              <input type="range" id="dbg-camera-tilt" min="-90" max="90" step="1" value="6" />
            </label>
            <label class="debug-row">
              <span>Top speed <output id="out-top-speed">14</output> rad/s</span>
              <input type="range" id="dbg-top-speed" min="4" max="30" step="0.5" value="14" />
            </label>
            <label class="debug-row">
              <span>Drag <output id="out-drag">2.5</output> rad/s²</span>
              <input type="range" id="dbg-drag" min="1" max="6" step="0.1" value="2.5" />
            </label>
            <button id="dbg-reset" type="button">Reset to defaults</button>
          </div>
        </details>

        <details>
          <summary>Background (experiment)</summary>
          <div class="debug-controls">
            <label class="debug-row">
              <span>Style</span>
              <select id="bg-mode">
                <option value="0">Plasma</option>
                <option value="1">Aurora</option>
                <option value="2">Radial pulse</option>
              </select>
            </label>
            <label class="debug-row">
              <span>Speed <output id="out-bg-speed">0.6</output></span>
              <input type="range" id="bg-speed" min="0" max="2" step="0.05" value="0.6" />
            </label>
            <label class="debug-row">
              <span>Brightness <output id="out-bg-intensity">0.55</output></span>
              <input type="range" id="bg-intensity" min="0" max="1.5" step="0.05" value="0.55" />
            </label>
          </div>
        </details>

        <details>
          <summary>Screen filters (experiment)</summary>
          <div class="debug-controls">
            <div class="preset-row">
              <button type="button" class="preset-btn" data-preset="none">None</button>
              <button type="button" class="preset-btn" data-preset="crt">CRT</button>
              <button type="button" class="preset-btn" data-preset="vhs">VHS</button>
              <button type="button" class="preset-btn" data-preset="jpeg">JPEG</button>
            </div>
            <label class="debug-row">
              <span>Scanlines <output id="out-flt-scanlines">0</output></span>
              <input type="range" id="flt-scanlines" min="0" max="1" step="0.05" value="0" />
            </label>
            <label class="debug-row">
              <span>Curvature <output id="out-flt-curvature">0</output></span>
              <input type="range" id="flt-curvature" min="0" max="0.4" step="0.01" value="0" />
            </label>
            <label class="debug-row">
              <span>Vignette <output id="out-flt-vignette">0</output></span>
              <input type="range" id="flt-vignette" min="0" max="1" step="0.05" value="0" />
            </label>
            <label class="debug-row">
              <span>Chromatic aberration <output id="out-flt-chroma">0</output></span>
              <input type="range" id="flt-chroma" min="0" max="0.015" step="0.001" value="0" />
            </label>
            <label class="debug-row">
              <span>Posterize levels <output id="out-flt-posterize">0 (off)</output></span>
              <input type="range" id="flt-posterize" min="0" max="16" step="1" value="0" />
            </label>
            <label class="debug-row">
              <span>Pixelation block <output id="out-flt-pixelate">0 (off)</output></span>
              <input type="range" id="flt-pixelate" min="0" max="16" step="1" value="0" />
            </label>
            <label class="debug-row">
              <span>Static noise <output id="out-flt-noise">0</output></span>
              <input type="range" id="flt-noise" min="0" max="0.5" step="0.02" value="0" />
            </label>
          </div>
        </details>
      </section>
    </main>
  </div>

  <canvas id="celebration-canvas"></canvas>

  <div id="winner-overlay" class="hidden">
    <div class="winner-card">
      <div class="winner-label">Winner!</div>
      <div id="winner-name" class="winner-name"></div>
      <button id="winner-close">Close</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="script.js"></script>
  <script type="module" src="background.js"></script>
  <script type="module" src="celebration.js"></script>
</body>
</html>
